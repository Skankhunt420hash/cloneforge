 assertReady();\n      emptyData();\n      seedErrors = [];\n      if (withSeed) applySeed();\n      await commit(names, 'reset');\n    },\n    health() {\n      const counts = {};\n      for (const n of names) counts[n] = data[n].length;\n      return {\n        ready, version, recovered, counts,\n        seedErrors: seedErrors.length,\n        lastError: lastError ? String(lastError.message || lastError) : null,\n      };\n    },\n  };\n  for (const n of names) db[n] = collections[n];\n  return db;\n}\n","src/db/index.js":"import AsyncStorage from '@react-native-async-storage/async-storage';\nimport { createDb } from './engine.js';\nimport { schema } from './schema.js';\nimport { seed } from './seed.js';\n\n// Eine lokale Datenbank pro App (offline, auf dem Geraet gespeichert).\nexport const db = createDb({ schema, seed, storage: AsyncStorage, key: 'app_db' });\nexport default db;\n","src/hooks.js":"import React, { useEffect, useState, useRef, useCallback } from 'react';\nimport { View, Text, ActivityIndicator } from 'react-native';\nimport { db } from './db/index.js';\n\n// Liest eine Collection live: Komponente rendert neu, sobald sich Daten aendern.\nexport function useCollection(name, query) {\n  const [, tick] = useState(0);\n  const qRef = useRef(query);\n  qRef.current = query;\n  useEffect(() => {\n    const off = db.subscribe(ev => {\n      if (!ev || !ev.collections || ev.collections.includes(name)) tick(n => n + 1);\n    });\n    return off;\n  }, [name]);\n  if (!db.isReady) return [];\n  return db.collection(name).list(qRef.current);\n}\n\nexport function useDocument(name, id) {\n  const [, tick] = useState(0);\n  useEffect(() => db.subscribe(() => tick(n => n + 1)), [name, id]);\n  if (!db.isReady || !id) return null;\n  return db.collection(name).get(id);\n}\n\n// Fuehrt eine async Aktion aus und liefert {run, busy, error}.\nexport function useAction(fn) {\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState(null);\n  const run = useCallback(async (...args) => {\n    setBusy(true); setError(null);\n    try { return await fn(...args); } catch (e) { setError(e); return undefined; } finally { setBusy(false); }\n  }, [fn]);\n  return { run, busy, error };\n}\n\n// Startet die Datenbank, bevor die App erscheint. Bei Fehlern: Hinweis + \"Neu versuchen\" statt weisser Bildschirm.\nexport function DbGate({ children, color = '#4f46e5' }) {\n  const [state, setState] = useState({ ready: db.isReady, error: null });\n  const [attempt, setAttempt] = useState(0);\n  useEffect(() => {\n    let alive = true;\n    db.init().then(\n      () => alive && setState({ ready: true, error: null }),\n      e => alive && setState({ ready: false, error: e })\n    );\n    return () => { alive = false; };\n  }, [attempt]);\n  if (state.error) {\n    return (\n      <View style={{ flex: 1, alignItems: 'center', justifyContent: 'center', padding: 24 }}>\n        <Text style={{ fontSize: 16, fontWeight: '700', marginBottom: 8 }}>Daten konnten nicht geladen werden</Text>\n        <Text style={{ opacity: 0.7, textAlign: 'center', marginBottom: 16 }}>{String(state.error.message || state.error)}</Text>\n        <Text onPress={() => setAttempt(a => a + 1)} style={{ color }}>Neu versuchen</Text>\n      </View>\n    );\n  }\n  if (!state.ready) return <View style={{ flex: 1, alignItems: 'center', justifyContent: 'center' }}><ActivityIndicator color={color} /></View>;\n  return children;\n}\n","src/ui/kit.js":"import React from 'react';\nimport { View, Text, TextInput, Pressable, ScrollView, Switch, Alert, Platform } from 'react-native';\nimport { theme } from '../theme.js';\n\nconst t = theme;\nexport const space = { xs: 4, sm: 8, md: 16, lg: 24 };\n\nexport function Screen({ title, children, scroll = true, right, padded = true }) {\n  const body = scroll\n    ? <ScrollView contentContainerStyle={{ padding: padded ? space.md : 0, paddingBottom: 48 }} keyboardShouldPersistTaps=\"handled\">{children}</ScrollView>\n    : <View style={{ flex: 1, padding: padded ? space.md : 0 }}>{children}</View>;\n  return (\n    <View style={{ flex: 1, backgroundColor: t.bg }}>\n      {title ? (\n        <View style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingHorizontal: space.md, paddingTop: space.lg, paddingBottom: space.sm }}>\n          <Text style={{ fontSize: 24, fontWeight: '800', color: t.text }}>{title}</Text>\n          {right || null}\n        </View>\n      ) : null}\n      {body}\n    </View>\n  );\n}\n\nexport function Card({ children, style, onPress }) {\n  const st = [{ backgroundColor: t.card, borderRadius: 14, padding: space.md, marginBottom: space.sm, borderWidth: 1, borderColor: t.border }, style];\n  return onPress ? <Pressable onPress={onPress} style={st}>{children}</Pressable> : <View style={st}>{children}</View>;\n}\n\nexport function Btn({ label, onPress, kind = 'primary', disabled, small }) {\n  const bg = kind === 'primary' ? t.primary : kind === 'danger' ? t.danger : 'transparent';\n  const fg = kind === 'ghost' ? t.primary : '#fff';\n  return (\n    <Pressable onPress={disabled ? undefined : onPress} style={{ backgroundColor: bg, opacity: disabled ? 0.5 : 1, paddingVertical: small ? 8 : 12, paddingHorizontal: small ? 12 : 18, borderRadius: 12, alignItems: 'center', borderWidth: kind === 'ghost' ? 1 : 0, borderColor: t.primary, marginVertical: 4 }}>\n      <Text style={{ color: fg, fontWeight: '700', fontSize: small ? 13 : 15 }}>{label}</Text>\n    </Pressable>\n  );\n}\n\nexport function Field({ label, value, onChangeText, placeholder, multiline, keyboardType, secure }) {\n  return (\n    <View style={{ marginBottom: space.sm }}>\n      {label ? <Text style={{ color: t.muted, fontSize: 12, marginBottom: 4 }}>{label}</Text> : null}\n      <TextInput value={value == null ? '' : String(value)} onChangeText={onChangeText} placeholder={placeholder} placeholderTextColor={t.muted}\n        multiline={multiline} keyboardType={keyboardType} secureTextEntry={secure}\n        style={{ backgroundColor: t.card, color: t.text, borderWidth: 1, borderColor: t.border, borderRadius: 10, padding: 12, minHeight: multiline ? 90 : undefined, textAlignVertical: multiline ? 'top' : 'center' }} />\n    </View>\n  );\n}\n\nexport function Toggle({ label, value, onValueChange }) {\n  return (\n    <View style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', paddingVertical: 6 }}>\n      <Text style={{ color: t.text, flex: 1 }}>{label}</Text>\n      <Switch value={!!value} onValueChange={onValueChange} trackColor={{ true: t.primary }} />\n    </View>\n  );\n}\n\nexport function Chip({ label, active, onPress }) {\n  return (\n    <Pressable onPress={onPress} style={{ paddingVertical: 6, paddingHorizontal: 12, borderRadius: 999, marginRight: 6, marginBottom: 6, backgroundColor: active ? t.primary : t.card, borderWidth: 1, borderColor: active ? t.primary : t.border }}>\n      <Text style={{ color: active ? '#fff' : t.text, fontSize: 13 }}>{label}</Text>\n    </Pressable>\n  );\n}\n\nexport function Badge({ label, color }) {\n  return <Text style={{ alignSelf: 'flex-start', backgroundColor: color || t.accent, color: '#fff', fontSize: 11, fontWeight: '700', paddingHorizontal: 8, paddingVertical: 2, borderRadius: 8, overflow: 'hidden' }}>{label}</Text>;\n}\n\nexport function Empty({ text = 'Noch nichts da.', action }) {\n  return (\n    <View style={{ alignItems: 'center', padding: space.lg }}>\n      <Text style={{ color: t.muted, marginBottom: 8, textAlign: 'center' }}>{text}</Text>\n      {action || null}\n    </View>\n  );\n}\n\nexport function ListItem({ title, subtitle, right, onPress }) {\n  return (\n    <Card onPress={onPress}>\n      <View style={{ flexDirection: 'row', alignItems: 'center' }}>\n        <View style={{ flex: 1 }}>\n          <Text style={{ color: t.text, fontWeight: '700', fontSize: 15 }}>{title}</Text>\n          {subtitle ? <Text style={{ color: t.muted, marginTop: 2 }}>{subtitle}</Text> : null}\n        </View>\n        {right || null}\n      </View>\n    </Card>\n  );\n}\n\nexport function Row({ children, style }) { return <View style={[{ flexDirection: 'row', alignItems: 'center', flexWrap: 'wrap' }, style]}>{children}</View>; }\nexport function H2({ children }) { return <Text style={{ color: t.text, fontSize: 17, fontWeight: '800', marginVertical: space.sm }}>{children}</Text>; }\nexport function Muted({ children }) { return <Text style={{ color: t.muted }}>{children}</Text>; }\n\n// Bestaetigungsdialog, der auch im Web funktioniert (Alert.alert tut dort nichts).\nexport function confirmDialog(message, onYes) {\n  if (Platform.OS === 'web') { if (typeof window !== 'undefined' && window.confirm(message)) onYes(); return; }\n  Alert.alert('Sicher?', message, [{ text: 'Abbrechen', style: 'cancel' }, { text: 'Ja', style: 'destructive', onPress: onYes }]);\n}\n","src/screens/DataScreen.js":"import React, { useState } from 'react';\nimport { Text, View, Platform, Share } from 'react-native';\nimport { Screen, Card, Btn, Field, H2, Muted, Row, confirmDialog } from '../ui/kit.js';\nimport { db } from '../db/index.js';\nimport { theme } from '../theme.js';\n\n// Backup, Import und Zuruecksetzen der lokalen Daten (ohne Server)\nexport default function DataScreen() {\n  const [text, setText] = useState('');\n  const [msg, setMsg] = useState('');\n  const [err, setErr] = useState('');\n  const [, bump] = useState(0);\n  const counts = db.isReady ? db.health().counts : {};\n  const total = Object.values(counts).reduce((a, b) => a + b, 0);\n  const ok = m => { setErr(''); setMsg(m); bump(n => n + 1); };\n  const fail = e => { setMsg(''); setErr(String((e && e.message) || e)); };\n\n  async function doExport() {\n    try {\n      await db.flush();\n      const json = db.exportJSON();\n      const name = 'backup-' + new Date().toISOString().slice(0, 10) + '.json';\n      if (Platform.OS === 'web') {\n        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));\n        const a = document.createElement('a');\n        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();\n        setTimeout(() => URL.revokeObjectURL(url), 5000);\n        ok('Backup heruntergeladen: ' + name);\n      } else {\n        await Share.share({ message: json, title: name });\n        ok('Backup geteilt (z. B. in Notizen, Mail oder Cloud speichern).');\n      }\n      setText(json);\n    } catch (e) { fail(e); }\n  }\n\n  async function doImport(source) {\n    try {\n      const t = String(source == null ? text : source).trim();\n      if (!t) throw new Error('Kein Backup eingefuegt.');\n      await db.importJSON(t);\n      await db.flush();\n      setText('');\n      ok('Backup importiert \u2013 ' + Object.values(db.health().counts).reduce((a, b) => a + b, 0) + ' Datensaetze.');\n    } catch (e) { fail(e); }\n  }\n\n  function pickFile() {\n    if (Platform.OS !== 'web') return;\n    const input = document.createElement('input');\n    input.type = 'file'; input.accept = '.json,application/json';\n    input.onchange = () => {\n      const f = input.files && input.files[0];\n      if (!f) return;\n      const r = new FileReader();\n      r.onload = () => doImport(String(r.result));\n      r.readAsText(f);\n    };\n    input.click();\n  }\n\n  return (\n    <Screen title=\"Daten\">\n      <Muted>Deine Daten liegen nur auf diesem Ger\xe4t. Mit einem Backup sicherst du sie oder nimmst sie aufs n\xe4chste Ger\xe4t mit.</Muted>\n      <Card style={{ marginTop: 12 }}>\n        <H2>Inhalt ({total})</H2>\n        {Object.keys(counts).map(k => <Text key={k} style={{ color: theme.text }}>{k}: {counts[k]}</Text>)}\n      </Card>\n      <H2>Backup</H2>\n      <Btn label={Platform.OS === 'web' ? '\u2b07\ufe0f Backup herunterladen' : '\ud83d\udce4 Backup teilen'} onPress={doExport} />\n      <H2>Import</H2>\n      {Platform.OS === 'web' ? <Btn kind=\"ghost\" label=\"\ud83d\udcc1 Backup-Datei w\xe4hlen\" onPress={pickFile} /> : null}\n      <Field label=\"Oder Backup-Text hier einf\xfcgen\" value={text} onChangeText={setText} multiline placeholder='{\"format\":\"cloneforge-db\", \u2026}' />\n      <Btn kind=\"ghost\" label=\"\u2b06\ufe0f Aus Text importieren\" onPress={() => confirmDialog('Der Import ersetzt alle aktuellen Daten. Fortfahren?', () => doImport())} disabled={!text.trim()} />\n      <H2>Zur\xfccksetzen</H2>\n      <Btn kind=\"danger\" label=\"\ud83d\uddd1\ufe0f Auf Demo-Daten zur\xfccksetzen\" onPress={() => confirmDialog('Alle eigenen Daten werden gel\xf6scht. Wirklich?', async () => { try { await db.reset({ seed: true }); ok('Auf Demo-Daten zur\xfcckgesetzt.'); } catch (e) { fail(e); } })} />\n      {msg ? <Text style={{ color: theme.accent, marginTop: 12 }}>{msg}</Text> : null}\n      {err ? <Text style={{ color: theme.danger, marginTop: 12 }}>{err}</Text> : null}\n    </Screen>\n  );\n}\n",".github/workflows/build.yml":"name: Build\n\n# Baut bei jedem Push: Web-ZIP, Android-APK und Quellcode-ZIP und legt alles als GitHub-Release ab\n# (Repo -> Releases, Dateien: *-web.zip, *.apk, *-source.zip).\non:\n  push:\n    branches: [main, master]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: build-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  web:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm install\n      - run: npx expo export --platform web --output-dir web-dist\n      - name: Web-ZIP packen\n        run: |\n          SLUG=$(node -p \"require('./package.json').name\")\n          mkdir -p out\n          (cd web-dist && zip -qr \"../out/${SLUG}-web.zip\" .)\n      - uses: actions/upload-artifact@v4\n        with:\n          name: web\n          path: out/*.zip\n\n  android:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: 17\n      - run: npm install\n      - name: Versionsnummer hochz\xe4hlen (n\xf6tig f\xfcr Updates und den Play Store)\n        run: node -e \"const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));a.expo.android=a.expo.android||{};a.expo.android.versionCode=${{ github.run_number }};fs.writeFileSync('app.json',JSON.stringify(a,null,2))\"\n      - run: npx expo prebuild --platform android --no-install\n      - name: Schlanker bauen (nur g\xe4ngige CPU-Typen)\n        run: printf '\\nreactNativeArchitectures=arm64-v8a,armeabi-v7a\\n' >> android/gradle.properties\n      - name: Signatur (nur wenn ein eigener Schl\xfcssel als Secret hinterlegt ist)\n        env:\n          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}\n          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\n          KSA: ${{ secrets.ANDROID_KEY_ALIAS }}\n        run: |\n          if [ -n \"$KS\" ]; then\n            echo \"$KS\" | base64 -d > android/app/release.keystore\n            printf '\\nCF_STORE_PASSWORD=%s\\nCF_KEY_ALIAS=%s\\n' \"$KSP\" \"$KSA\" >> android/gradle.properties\n            node -e \"const fs=require('fs');let g=fs.readFileSync('android/app/build.gradle','utf8');g=g.replace(/signingConfigs\\s*\\{/,'signingConfigs {\\n        release {\\n            storeFile file(\\'release.keystore\\')\\n            storePassword project.property(\\'CF_STORE_PASSWORD\\')\\n            keyAlias project.property(\\'CF_KEY_ALIAS\\')\\n            keyPassword project.property(\\'CF_STORE_PASSWORD\\')\\n        }');g=g.replace(/(buildTypes\\s*\\{[\\s\\S]*?release\\s*\\{[\\s\\S]*?)signingConfig signingConfigs\\.debug/,'\\$1signingConfig signingConfigs.release');fs.writeFileSync('android/app/build.gradle',g)\"\n            echo \"Eigener Schl\xfcssel wird verwendet.\"\n          else\n            echo \"Kein eigener Schl\xfcssel hinterlegt \u2013 Debug-Signatur (zum Testen).\"\n          fi\n      - name: Android bauen\n        run: |\n          set -o pipefail\n          cd android && ./gradlew assembleRelease bundleRelease --no-daemon --console=plain 2>&1 | tee ../gradle.log\n      - name: Fehlerprotokoll sichern (nur bei Fehler, Branch build-log)\n        if: failure()\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          { grep -n -i -E 'error|exception|caused by|exit value|what went wrong|> Task .*FAILED' gradle.log | head -60; echo ----; tail -n 250 gradle.log; } > /tmp/build-error.txt || echo \"kein Log\" > /tmp/build-error.txt\n          git config user.name CloneForge && git config user.email bot@cloneforge.local\n          git checkout -q --orphan build-log\n          git rm -rf . -q || true\n          cp /tmp/build-error.txt build-error.txt\n          git add build-error.txt && git commit -qm \"Fehlerprotokoll Build ${{ github.run_number }}\" && git push -f origin build-log || true\n      - name: APK und AAB einsammeln\n        run: |\n          SLUG=$(node -p \"require('./package.json').name\")\n          mkdir -p out\n          cp android/app/build/outputs/apk/release/*.apk \"out/${SLUG}.apk\"\n          cp android/app/build/outputs/bundle/release/*.aab \"out/${SLUG}.aab\"\n      - uses: actions/upload-artifact@v4\n        with:\n          name: android\n          path: |\n            out/*.apk\n            out/*.aab\n\n  source:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Quellcode-ZIP packen\n        run: |\n          SLUG=$(node -p \"require('./package.json').name\" 2>/dev/null || echo app)\n          mkdir -p out\n          zip -qr \"out/${SLUG}-source.zip\" . -x \".git/*\" \"node_modules/*\" \"web-dist/*\" \"dist/*\" \"android/*\" \"ios/*\" \"out/*\"\n      - uses: actions/upload-artifact@v4\n        with:\n          name: source\n          path: out/*.zip\n\n  release:\n    needs: [web, android, source]\n    if: ${{ always() && needs.web.result == 'success' && needs.source.result == 'success' }}\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/download-artifact@v4\n        with:\n          path: out\n          merge-multiple: true\n      - name: Release anlegen\n        env:\n          GH_TOKEN: ${{ github.token }}\n          REPO: ${{ github.repository }}\n        run: |\n          TAG=\"build-${{ github.run_number }}\"\n          gh release create \"$TAG\" out/* --repo \"$REPO\" --title \"Build ${{ github.run_number }}\" --notes \"Automatisch gebaut: Web-ZIP, Android-APK (falls der Android-Build lief) und Quellcode.\"\n","scripts/pack.mjs":"#!/usr/bin/env node\n// Packt diese App lokal in ZIP / Web-Dateien / APK. Aufruf:  node scripts/pack.mjs [zip|web|apk|all]\n// Ergebnis liegt im Ordner release/. Braucht nur Node (fuer apk zusaetzlich Android SDK + Java 17).\nimport fs from 'node:fs';\nimport path from 'node:path';\nimport zlib from 'node:zlib';\nimport { spawnSync } from 'node:child_process';\nimport { fileURLToPath } from 'node:url';\n\nconst root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');\nconst pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));\nconst slug = pkg.name || 'app';\nconst outDir = path.join(root, 'release');\nconst what = (process.argv[2] || 'all').toLowerCase();\nconst SKIP = new Set(['node_modules', '.git', 'release', 'web-dist', 'dist', 'android', 'ios', 'out', '.expo']);\n\nconst T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();\nconst crc32 = b => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };\n\nfunction walk(dir, base = dir, skipTop = true) {\n  const out = [];\n  for (const e of fs.readdirSync(dir, { withFileTypes: true })) {\n
